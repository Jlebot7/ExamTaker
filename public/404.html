<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ExamTaker - Redirigiendo...</title>
    <script type="text/javascript">
      // Redirigir rutas de GitHub Pages al hash routing de la SPA
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background-color: #030712; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirigiendo a la evaluación...</p>
  </body>
</html>
